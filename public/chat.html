<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Support Chat - Supper Cash</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #0047AB;
            --primary-dark: #002D72;
            --secondary: #1A1A2E;
            --light-bg: #f5f7ff;
            --white: #ffffff;
            --gray: #8C98A9;
            --gray-light: #F0F2F5;
            --success: #00C853;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s ease;
        }

        body {
            background: linear-gradient(135deg, #f5f7ff 0%, #eef1ff 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: var(--white);
            box-shadow: var(--shadow);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            color: var(--secondary);
        }

        .back-btn {
            background: var(--gray-light);
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            color: var(--secondary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* Main Chat Container */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            margin: 30px auto;
            width: 100%;
            padding: 0 20px;
        }

        /* Admin Info */
        .admin-info {
            background: var(--white);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .admin-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .admin-details h3 {
            font-size: 18px;
            color: var(--secondary);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--success);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat Area */
        .chat-area {
            background: var(--white);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 280px);
            min-height: 400px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #fafbff;
            border-radius: 20px 20px 0 0;
        }

        /* Message Bubbles */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.sent {
            align-self: flex-end;
        }

        .message.received {
            align-self: flex-start;
        }

        .message-content {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.received .message-content {
            background: var(--gray-light);
            color: var(--secondary);
            border-bottom-left-radius: 5px;
        }

        .message-time {
            font-size: 11px;
            color: var(--gray);
            margin-top: 5px;
            margin-left: 10px;
        }

        .message.sent .message-time {
            text-align: right;
            margin-right: 10px;
            margin-left: 0;
        }

        /* System Message */
        .system-message {
            align-self: center;
            background: rgba(0, 71, 171, 0.1);
            color: var(--primary);
            padding: 8px 15px;
            border-radius: 50px;
            font-size: 12px;
            margin: 10px 0;
            max-width: 80%;
            text-align: center;
        }

        /* Chat Input */
        .chat-input-area {
            padding: 25px 30px;
            background: white;
            border-top: 2px solid var(--gray-light);
            border-radius: 0 0 20px 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .message-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid var(--gray-light);
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
            resize: none;
            max-height: 120px;
            min-height: 50px;
            line-height: 1.5;
            font-family: inherit;
        }

        .message-input:focus {
            border-color: var(--primary);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: var(--gray);
            margin-top: 8px;
            padding-right: 10px;
        }

        .char-counter.warning {
            color: #FF9800;
        }

        .char-counter.danger {
            color: #FF5252;
        }

        /* Loading Spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--gray-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Notification Toast */
        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Quick Reply Buttons */
        .quick-replies {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .quick-reply {
            background: var(--gray-light);
            border: none;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            color: var(--secondary);
        }

        .quick-reply:hover {
            background: var(--primary);
            color: white;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--gray);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            color: var(--primary);
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .message {
                max-width: 85%;
            }
            
            .header {
                padding: 15px 20px;
            }
            
            .chat-container {
                margin: 20px auto;
            }
            
            .messages-container {
                padding: 20px;
            }
            
            .chat-input-area {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .logo-text {
                font-size: 18px;
            }
            
            .admin-info {
                padding: 15px;
            }
            
            .admin-avatar {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Notification Toast -->
    <div id="notificationToast" class="notification-toast">
        <i class="fas fa-bell"></i>
        <span id="toastMessage">New message received!</span>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-comment-dots"></i>
            </div>
            <div class="logo-text">Support Chat</div>
        </div>
        <a href="/dashboard.html" class="back-btn">
            <i class="fas fa-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

    <!-- Main Chat Container -->
    <div class="chat-container">
        <!-- Admin Info -->
        <div class="admin-info">
            <div class="admin-avatar">
                <i class="fas fa-headset"></i>
            </div>
            <div class="admin-details">
                <h3>
                    Support Team
                    <span class="admin-status">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </h3>
                <p style="color: var(--gray); font-size: 14px;">We typically reply in a few minutes</p>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="messages-container" id="messagesContainer">
                <!-- Welcome Message -->
                <div class="system-message">
                    👋 Welcome! How can we help you today?
                </div>
            </div>

            <!-- Chat Input -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea class="message-input" id="messageInput" 
                              placeholder="Type your message here..." 
                              rows="1"
                              onkeydown="handleKeyDown(event)"
                              oninput="autoResize(this); updateCharCounter()"
                              maxlength="500"></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                
                <div class="char-counter" id="charCounter">0/500</div>

                <!-- Quick Replies -->
                <div class="quick-replies">
                    <button class="quick-reply" onclick="insertQuickMessage('Hello, I need help')">
                        👋 Hello
                    </button>
                    <button class="quick-reply" onclick="insertQuickMessage('I have a question about my balance')">
                        💰 Balance
                    </button>
                    <button class="quick-reply" onclick="insertQuickMessage('I want to make a deposit')">
                        📥 Deposit
                    </button>
                    <button class="quick-reply" onclick="insertQuickMessage('Thank you for your help')">
                        🙏 Thanks
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== Configuration ====================
        const ADMIN_PHONE = '12568212395'; // Admin WhatsApp number
        let currentUser = null;
        let messages = [];
        let messageCheckInterval;

        // ==================== Initial Load ====================
        window.addEventListener('load', async () => {
            await loadCurrentUser();
            await loadChatHistory();
            startPolling();
            updateCharCounter();
        });

        // ==================== User Data ====================
        async function loadCurrentUser() {
            try {
                const res = await fetch('/user-info');
                if (!res.ok) {
                    window.location.href = '/login.html';
                    return;
                }
                const data = await res.json();
                currentUser = {
                    email: data.email,
                    fullName: data.fullName
                };
            } catch (err) {
                console.error('Error loading user:', err);
                showNotification('Error loading user data', 'error');
            }
        }

        // ==================== Chat Functions ====================
        async function loadChatHistory() {
            if (!currentUser) return;

            try {
                const res = await fetch(`/api/chat/history/${ADMIN_PHONE}`);
                if (!res.ok) return;
                
                messages = await res.json();
                displayMessages();
                scrollToBottom();
            } catch (err) {
                console.error('Error loading chat history:', err);
            }
        }

        function displayMessages() {
            const container = document.getElementById('messagesContainer');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="system-message">
                        👋 Welcome! How can we help you today?
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = null;

            messages.forEach(msg => {
                const isFromMe = msg.from === currentUser?.email;
                const isFromAdmin = msg.from === ADMIN_PHONE;
                const msgDate = new Date(msg.timestamp).toDateString();
                
                // Add date separator if date changed
                if (msgDate !== lastDate) {
                    html += `
                        <div class="system-message">
                            ${new Date(msg.timestamp).toLocaleDateString('en-US', { 
                                weekday: 'long', 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            })}
                        </div>
                    `;
                    lastDate = msgDate;
                }

                html += `
                    <div class="message ${isFromMe ? 'sent' : 'received'}">
                        <div class="message-content">
                            ${escapeHtml(msg.message)}
                        </div>
                        <div class="message-time">
                            ${new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message || !currentUser) return;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        to: ADMIN_PHONE,
                        message: message
                    })
                });

                if (res.ok) {
                    input.value = '';
                    autoResize(input);
                    updateCharCounter();
                    await loadChatHistory();
                } else {
                    showNotification('Failed to send message', 'error');
                }
            } catch (err) {
                console.error('Error sending message:', err);
                showNotification('Error sending message', 'error');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // ==================== Message Polling ====================
        function startPolling() {
            messageCheckInterval = setInterval(async () => {
                await checkNewMessages();
            }, 3000);
        }

        async function checkNewMessages() {
            if (!currentUser) return;

            try {
                const res = await fetch(`/api/chat/history/${ADMIN_PHONE}`);
                if (!res.ok) return;
                
                const newMessages = await res.json();
                
                if (newMessages.length > messages.length) {
                    const oldCount = messages.length;
                    messages = newMessages;
                    displayMessages();
                    scrollToBottom();
                    
                    const newMsgCount = messages.length - oldCount;
                    if (newMsgCount > 0) {
                        const lastMsg = messages[messages.length - 1];
                        if (lastMsg.from === ADMIN_PHONE) {
                            showNotification(`New message from Support`);
                        }
                    }
                }
            } catch (err) {
                console.error('Error checking new messages:', err);
            }
        }

        // ==================== UI Helpers ====================
        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            if (container) {
                container.scrollTop = container.scrollHeight;
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function updateCharCounter() {
            const input = document.getElementById('messageInput');
            const counter = document.getElementById('charCounter');
            const length = input.value.length;
            
            counter.textContent = `${length}/500`;
            
            counter.classList.remove('warning', 'danger');
            if (length > 450) {
                counter.classList.add('danger');
            } else if (length > 400) {
                counter.classList.add('warning');
            }
        }

        function insertQuickMessage(msg) {
            const input = document.getElementById('messageInput');
            input.value = msg;
            autoResize(input);
            updateCharCounter();
            input.focus();
        }

        // ==================== Notification ====================
        function showNotification(message, type = 'success') {
            const toast = document.getElementById('notificationToast');
            const toastMessage = document.getElementById('toastMessage');
            
            toastMessage.textContent = message;
            toast.style.background = type === 'success' ? 'var(--primary)' : '#FF5252';
            toast.style.display = 'flex';
            
            setTimeout(() => {
                toast.style.display = 'none';
            }, 3000);
        }

        // ==================== Event Listeners ====================
        window.addEventListener('online', () => {
            showNotification('🟢 Back online');
            loadChatHistory();
        });

        window.addEventListener('offline', () => {
            showNotification('🔴 You are offline', 'error');
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                loadChatHistory();
            }
        });

        // ==================== Cleanup ====================
        window.addEventListener('beforeunload', () => {
            if (messageCheckInterval) {
                clearInterval(messageCheckInterval);
            }
        });
    </script>
</body>
</html>
