<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>💬 Live Support Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .chat-container {
      width: 95%;
      max-width: 420px;
      height: 90vh;
      background: #111;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
      overflow: hidden;
    }

    .chat-header {
      padding: 16px;
      background: #1f8ef1;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #0b0b0b;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      margin-bottom: 10px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn .2s ease-in;
    }

    .sent {
      background: #1f8ef1;
      margin-left: auto;
      border-bottom-right-radius: 4px;
    }

    .received {
      background: #2a2a2a;
      margin-right: auto;
      border-bottom-left-radius: 4px;
    }

    .time {
      font-size: 10px;
      opacity: .6;
      margin-top: 4px;
      text-align: right;
    }

    .chat-input {
      display: flex;
      padding: 12px;
      background: #111;
      border-top: 1px solid #222;
    }

    .chat-input input {
      flex: 1;
      padding: 12px;
      border-radius: 25px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .chat-input button {
      margin-left: 10px;
      background: #1f8ef1;
      border: none;
      color: #fff;
      padding: 0 18px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
    }

    .chat-input button:hover {
      background: #0d6efd;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    💬 Admin Support
  </div>

  <div id="messages" class="messages">
    <p style="opacity:.6;text-align:center">Loading chat...</p>
  </div>

  <div class="chat-input">
    <input type="text" id="messageInput" placeholder="Type your message…" />
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  let adminUser = null;

  async function checkSession() {
    const res = await fetch('/check-session');
    const data = await res.json();
    if (!data.loggedIn) {
      window.location.href = '/login.html';
    }
  }

  async function getAdmin() {
    const res = await fetch('/api/chat/users');
    const users = await res.json();
    adminUser = users[0]; // user only sees admin
  }

  async function loadMessages() {
    if (!adminUser) return;

    const res = await fetch(`/api/chat/history/${adminUser.phone}`);
    const messages = await res.json();

    const box = document.getElementById('messages');
    box.innerHTML = '';

    messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.from === adminUser.phone ? 'received' : 'sent');

      div.innerHTML = `
        ${m.message}
        <div class="time">${new Date(m.timestamp).toLocaleTimeString()}</div>
      `;
      box.appendChild(div);
    });

    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if (!text || !adminUser) return;

    input.value = '';

    await fetch('/api/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        to: adminUser.phone,
        message: text
      })
    });

    loadMessages();
  }

  document.getElementById('messageInput')
    .addEventListener('keypress', e => {
      if (e.key === 'Enter') sendMessage();
    });

  async function init() {
    await checkSession();
    await getAdmin();
    await loadMessages();
    setInterval(loadMessages, 3000); // auto refresh
  }

  init();
</script>

</body>
</html>
